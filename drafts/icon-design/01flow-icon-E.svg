<svg id="svg-concept-E" class="w-full h-full" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bg-E" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#18181B"/>
                  <stop offset="100%" stop-color="#09090B"/>
                </linearGradient>
                <linearGradient id="card-1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38BDF8"/>
                  <stop offset="100%" stop-color="#2563EB"/>
                </linearGradient>
                <linearGradient id="card-2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34D399"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
                <linearGradient id="card-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F472B6"/>
                  <stop offset="100%" stop-color="#E11D48"/>
                </linearGradient>
                <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
                </filter>
              </defs>
              <rect class="icon-bg" width="512" height="512" rx="64" fill="url(#bg-E)"/>
              <rect class="icon-bg-border" width="510" height="510" x="1" y="1" rx="63" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

              <!-- 虚线时间轴导轨 -->
              <path d="M190 110 V 400" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-dasharray="6 8"/>
              <path d="M190 256 H 240" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-dasharray="4 6"/>

              <!-- 错落悬浮的三张胶囊卡片 (象征思维线、标签与主记录) -->
              <!-- 卡片 1: 蓝色主想法 -->
              <rect x="160" y="140" width="220" height="64" rx="20" fill="url(#card-1-grad)" filter="url(#card-shadow)"/>
              <circle cx="190" cy="172" r="10" fill="#FFFFFF"/>
              <rect x="220" y="166" width="120" height="12" rx="6" fill="rgba(255,255,255,0.85)"/>

              <!-- 卡片 2: 翡翠绿分支 -->
              <rect x="220" y="226" width="180" height="60" rx="20" fill="url(#card-2-grad)" filter="url(#card-shadow)"/>
              <circle cx="250" cy="256" r="8" fill="#FFFFFF"/>
              <rect x="275" y="250" width="90" height="12" rx="6" fill="rgba(255,255,255,0.85)"/>

              <!-- 卡片 3: 玫粉色回顾纽带 -->
              <rect x="180" y="310" width="210" height="62" rx="20" fill="url(#card-3-grad)" filter="url(#card-shadow)"/>
              <circle cx="210" cy="341" r="9" fill="#FFFFFF"/>
              <rect x="235" y="335" width="115" height="12" rx="6" fill="rgba(255,255,255,0.85)"/>
            </svg>